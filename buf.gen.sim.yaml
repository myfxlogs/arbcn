# simv1 域代码生成模板（M3-c C1 独立域，D-038 ①）：
#   protoc-gen-go / protoc-gen-connect-go → internal/simapi/gen（Go，入仓库）
#   protoc-gen-es → web/src/gen（TS，入仓库）
# 生成命令：buf generate --template buf.gen.sim.yaml
# 与 dashboardv1 隔离（dashboard 模板 buf.gen.yaml 输入限定 arbcn/dashboard/v1）；
# 不动 dashboardv1 生成物（其 .proto 源虽有但 M3-c 边界 = 零回归）。
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/simapi/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/simapi/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
inputs:
  - directory: proto
    paths:
      - proto/arbcn/sim/v1
