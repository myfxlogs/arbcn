name: ci
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: web
      - run: npm run build # 前端产物须在 go build 之前（web/embed.go go:embed dist）
        working-directory: web
      - run: go mod download
      - run: go build ./...
      - run: go vet ./...
      # DB 集成测试无 ARBCN_TEST_PG_DSN 自动 skip（practices #33，不设即全绿）；
      # network 门禁测试（TestNoNetworkImports 等）纯文件扫描无外部依赖。
      - run: go test -race -count=1 ./...
      - run: ./scripts/check-lines.sh
