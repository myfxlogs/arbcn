# 本地开发依赖：postgres 16 单容器（docs/design/02-monitor-architecture.md §2/§10）。
# 用法：docker compose up -d arbcn-postgres
# Schema 初始化：不再走 docker-entrypoint，由程序启动时的版本化迁移
# （internal/store/pgstore.Migrate，schema_migrations 记账）执行。
services:
  arbcn-postgres:
    image: postgres:16
    container_name: arbcn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbcn
      POSTGRES_PASSWORD: arbcn
      POSTGRES_DB: arbcn
    ports:
      - "5434:5432"
    volumes:
      - arbcn-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbcn -d arbcn"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  arbcn-pgdata:
