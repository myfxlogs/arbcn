// arbcn 决策仪表盘 ConnectRPC 服务（docs/design/02-monitor-architecture.md §9）。
// 最小集：只读查询 + 告警确认；无交易、无事实写入（§1 铁律：资金动作永远人工）。
syntax = "proto3";

package arbcn.dashboard.v1;

import "google/protobuf/timestamp.proto";

option go_package = "arbcn/internal/dashboard/gen/arbcn/dashboard/v1;dashboardv1";

// DashboardService 为 Web 仪表盘提供数据查询与告警确认接口。
// 除 AckAlert 外全部只读；无任何资金/交易能力。
service DashboardService {
  // ListLatestFacts 返回每 (kind, venue, symbol) 的最新事实（机会面板快照）。
  rpc ListLatestFacts(ListLatestFactsRequest) returns (ListLatestFactsResponse);
  // ListAlerts 时间降序分页返回告警流。
  rpc ListAlerts(ListAlertsRequest) returns (ListAlertsResponse);
  // AckAlert 单条确认（幂等；未知 id 无操作）。
  rpc AckAlert(AckAlertRequest) returns (AckAlertResponse);
  // ListTriggerStates 返回各规则状态机（armed/active/resolved + 最近转变）。
  rpc ListTriggerStates(ListTriggerStatesRequest) returns (ListTriggerStatesResponse);
  // Health 与 /healthz 同源：进程存活 + DB 可达 + 迁移应用状态。
  rpc Health(HealthRequest) returns (HealthResponse);
  // ListUnacked 返回未读告警列表 + 计数（未读 = acked=false；M2-a §1.2 铃铛）。
  rpc ListUnacked(ListUnackedRequest) returns (ListUnackedResponse);
  // AckAll 全部已读（单事务 UPDATE alerts SET acked=true WHERE acked=false；M2-a §1.2）。
  rpc AckAll(AckAllRequest) returns (AckAllResponse);
  // ListSourceHealth 返回各启用源 freshness 状态（live/stale/down；M2-a §2.1/§2.2）。
  rpc ListSourceHealth(ListSourceHealthRequest) returns (ListSourceHealthResponse);
  // ListFacts 事实快照 + RMB 折算（M2-b §4/§5 机器可读投影）。
  // 覆盖 kind（funding/defi_rate/deposit_rate）× 当日 USDCNH → RMB 净收益视角；
  // 原始事实不污染（02 §8）。
  rpc ListFacts(ListFactsRequest) returns (ListFactsResponse);
  // AddLedgerEntry 手工录入台账行（M2-b §6 出入金流水；资金动作永远人工 §1）。
  rpc AddLedgerEntry(AddLedgerEntryRequest) returns (AddLedgerEntryResponse);
  // ListLedgerEntries 台账流水（date DESC, id DESC 分页）。
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  // LedgerSummary 按档位归因汇总（GROUP BY tier 简单分组；M2-b §6）。
  rpc LedgerSummary(LedgerSummaryRequest) returns (LedgerSummaryResponse);
  // ListInsights 进化建议（D-044 L0）：系统依据数据自动标记的「待核实证据候选」，
  // 供决策层参考。只读证据表面——只产出候选 + 建议动作，永不自动改规则/执行。
  rpc ListInsights(ListInsightsRequest) returns (ListInsightsResponse);
  // ListOppCards 机会实算卡（D-046）：对当前实时机会做确定性算账——瞬时/30 日均值/
  // 保本天数/扣摩擦净年化/三档判定/中文模板叙述。只读证据表面，不触碰执行门禁。
  rpc ListOppCards(ListOppCardsRequest) returns (ListOppCardsResponse);
  // ListKnowledgeEntries 市场结构经验库浏览（D-046）：返回全部条目（signature ASC）。
  // 吸收 = 人工 + D#（seed 落盘），匹配 = 确定性签名，呈现 = 只读——系统永不自动吸收。
  rpc ListKnowledgeEntries(ListKnowledgeEntriesRequest) returns (ListKnowledgeEntriesResponse);
  // ReviewKnowledgeEntry 人工复核经验条目（D-054）：决策层评估后填复核结论——
  // validated_at=now + 生命周期 status（active/superseded/retracted）+ 可选更新判定
  // 文本 verdict + 复核 note。人工在环动作（D-046 复核闭环的 UI 落点），只改该
  // signature 条目的判定记录（呈现面），不改任何规则/门禁。
  rpc ReviewKnowledgeEntry(ReviewKnowledgeEntryRequest) returns (ReviewKnowledgeEntryResponse);
}

// Fact 与 internal/fact.Fact 一一对应（统一事实模型 §4）。
message Fact {
  string kind = 1;  // funding / defi_rate / reverse_repo / iv / calendar ...
  string venue = 2;
  string symbol = 3;
  double value = 4;  // 口径由 kind 约定（见 fact.Unit* 常量表）
  string unit = 5;   // pct_annualized / price / pct / days / ratio
  google.protobuf.Timestamp ts = 6;
  string src = 7;
}

message ListLatestFactsRequest {
  string kind = 1;    // 空 = 全部
  string venue = 2;   // 空 = 全部
  string symbol = 3;  // 空 = 全部
}

message ListLatestFactsResponse {
  repeated Fact facts = 1;
}

// Alert 与 store.Alert 对应；acked = 用户在仪表盘确认过（独立于投递状态 delivered）。
message Alert {
  int64 id = 1;
  int64 rule_id = 2;
  string rule_name = 3;
  google.protobuf.Timestamp ts = 4;
  string level = 5;  // info / warn / critical
  string message = 6;
  bool acked = 7;
}

message ListAlertsRequest {
  int32 limit = 1;   // 分页大小；≤0 = 默认 100，上限 500
  int32 offset = 2;  // 分页偏移；<0 = 0
}

message ListAlertsResponse {
  repeated Alert alerts = 1;
}

message AckAlertRequest {
  int64 id = 1;
}

message AckAlertResponse {}

message TriggerState {
  string rule_name = 1;
  string state = 2;                     // armed / active / resolved
  google.protobuf.Timestamp since = 3;  // 最近一次转变时刻；零值 = 尚未转变
  optional double last_value = 4;       // 最近评估值；从未评估 = 缺省
}

message ListTriggerStatesRequest {}

message ListTriggerStatesResponse {
  repeated TriggerState states = 1;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;  // ok / degraded
  string reason = 2;  // 空 = ok；db_unreachable / pending_migrations / migrations_check_failed
}

// UnackedAlert 未读告警行（铃铛抽屉条目；M2-a §1.2）。
message UnackedAlert {
  int64 id = 1;
  string rule = 2;  // 规则名（alerts JOIN rules）
  string level = 3; // info / warn / critical
  string message = 4;
  google.protobuf.Timestamp ts = 5;
}

message ListUnackedRequest {}

message ListUnackedResponse {
  repeated UnackedAlert items = 1;
  int32 total = 2; // 未读总数（= len(items)；未读数小，一次拉全）
}

message AckAllRequest {}

message AckAllResponse {
  int32 acked_count = 1; // 本次标记已读的告警数
}

// SourceHealth 单个启用源的 freshness 视图（M2-a §2.2）。
message SourceHealth {
  string name = 1;
  int64 interval_sec = 2;                     // 源轮询间隔（sched 配置）
  google.protobuf.Timestamp last_poll_at = 3; // 最近一次成功轮询时刻（heartbeat 反推）
  google.protobuf.Timestamp last_fact_at = 4; // 该源 kind 最新 fact ts；缺省 = 从未产出
  string status = 5;                          // live / stale / down（§2.1 判定）
}

message ListSourceHealthRequest {}

message ListSourceHealthResponse {
  repeated SourceHealth items = 1;
}

// FactRmb 事实快照 + RMB 折算（M2-b §4/§5 机器可读投影）。
// 原始事实字段（kind/venue/symbol/value/unit/ts/src）不被改写（02 §8 不污染）；
// rmb_value/fx_rate/fx_available 为展示层折算结果。
message FactRmb {
  string kind = 1;
  string venue = 2;
  string symbol = 3;
  double value = 4;       // USD 原值（不污染）
  string unit = 5;
  google.protobuf.Timestamp ts = 6;
  string src = 7;
  double rmb_value = 8;   // RMB 净收益视角；汇率缺失 = value（USD 原值）
  double fx_rate = 9;     // 当日 USDCNH；0 = 不可用
  bool fx_available = 10; // 汇率可用（false → 前端显示「汇率不可用」）
  bool covered = 11;      // 本行 kind 是否 RMB 折算覆盖（与 rmb.CoveredKinds 同源；D-047 消除前端重复集合）
}

message ListFactsRequest {
  string kind = 1;    // 空 = 全部
  string venue = 2;   // 空 = 全部
  string symbol = 3;  // 空 = 全部
}

message ListFactsResponse {
  repeated FactRmb facts = 1;
  double fx_rate = 2;                     // 当日 USDCNH（快照级；0 = 不可用）
  bool fx_available = 3;                  // 汇率可用
  google.protobuf.Timestamp fx_ts = 4;    // 汇率报价时刻；缺省 = 不可用
}

// LedgerEntry 台账行（M2-b §6 出入金流水）。
message LedgerEntry {
  int64 id = 1;
  google.protobuf.Timestamp date = 2; // 出入金日期
  string channel = 3;                 // 通道（binance / okx / 民营定期 / 逆回购 ...）
  string currency = 4;                // 币种（RMB / USD / USDT / USDC / BTC ...）
  double amount = 5;                  // 金额；正 = 入金，负 = 出金
  double fee_rate = 6;                // 费率 %
  string tier = 7;                    // 档位（store Tier* 常量；entry 自带，不推断）
  string note = 8;                    // 备注
}

message AddLedgerEntryRequest {
  google.protobuf.Timestamp date = 1; // 出入金日期
  string channel = 2;
  string currency = 3;
  double amount = 4;   // 正 = 入金，负 = 出金
  double fee_rate = 5;
  string tier = 6;
  string note = 7;
}

message AddLedgerEntryResponse {
  int64 id = 1; // 新行 id
}

message ListLedgerEntriesRequest {
  int32 limit = 1;   // 分页大小；≤0 = 默认 100
  int32 offset = 2;  // 分页偏移；<0 = 0
}

message ListLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
}

message LedgerSummaryRequest {}

message TierSummary {
  string tier = 1;       // 档位（store Tier* 常量；空 = 未分类）
  double inflow = 2;     // 累计入金
  double outflow = 3;    // 累计出金（绝对值）
  double net = 4;        // 净额
  int32 entry_count = 5; // 笔数
}

message LedgerSummaryResponse {
  repeated TierSummary items = 1;
}

// Insight 进化建议条目（D-044 L0）：一条证据信号 + 给决策层的候选动作。
message Insight {
  string id = 1;       // 稳定 key，如 "reject_dist" / "defi_anomaly:aave-v3" / "no_order" / "source_down:binance"
  string category = 2; // risk / anomaly / opportunity / data / knowledge
  string severity = 3; // info / warn / critical
  string title = 4;    // 中文标题
  string detail = 5;   // 中文明细 + 数值
  google.protobuf.Timestamp at = 6; // 生成时刻
  repeated string actions = 7;       // 候选动作（指向 D# 人工决策，不自动执行）
}

message ListInsightsRequest {}

message ListInsightsResponse {
  repeated Insight insights = 1;
}

// OpportunityCard 机会实算卡（D-046）：确定性算账结果（纯公式，非 LLM 生成）。
message OpportunityCard {
  string kind = 1;          // funding_hedge / carry_asset / repo（store SimKind* 口径）
  string venue = 2;
  string symbol = 3;
  double inst = 4;          // 瞬时年化 %（最新事实值）
  double avg_30d = 5;       // 30 日均值 %；0 = 样本不足（前端显示 —）
  double break_even_days = 6; // 保本持续天数；0 = 不适用（friction=0 / 当前费率 ≤0）
  double net_annualized = 7;  // 扣摩擦净年化 %（30 日持有口径）；0 = 均值样本不足
  double friction_pct = 8;    // 摩擦假设 %（funding=配置常量，carry/repo≈0）
  string rating = 9;          // grab / breakeven / trap（Rating* 常量）
  string narrative = 10;      // 中文模板叙述（D-043；明示摩擦假设，见代码注释）
}

message ListOppCardsRequest {}

message ListOppCardsResponse {
  repeated OpportunityCard cards = 1;
}

// KnowledgeEntry 市场结构经验库条目（D-046）：一条已核实的市场结构模式判定记录。
// 吸收 = 人工 + D#（git 跟踪 seed）；系统只匹配与呈现，不吸收、不改 verdict。
message KnowledgeEntry {
  int64 id = 1;
  google.protobuf.Timestamp ts = 2;       // 吸收时刻
  string signature = 3;                   // 受控签名键（knowledge.Signature*）
  string venue = 4;                       // seed 实例 venue（溯源用）
  string symbol = 5;                      // seed 实例 symbol
  string verdict = 6;                     // 人工判定（D# 落）
  string rationale = 7;                   // 判定依据（中文）
  string source = 8;                      // 出处（对话 #N / D#）
  string status = 9;                      // active / superseded / retracted
  google.protobuf.Timestamp validated_at = 10; // 复核时刻；缺省 = 待复核
  string validation_note = 11;            // 复核结论
  string current_evidence = 12;           // 当前核验证据（D-059：自动探测器对最新数据核验，供人工复核裁决；只读，不写判定）
  string review_direction = 13;           // 复核时证据方向快照（D-060：hit=命中 / miss=未命中；空 = 未快照）。仅呈现，不参与规则/门禁
  bool recheck_needed = 14;               // 方向翻转检测（D-060）：已复核 + 有快照 + 当前方向可判定，且当前方向 ≠ 快照方向 = 翻转 → 建议复核；一致 = 仍适用
}

message ListKnowledgeEntriesRequest {}

message ListKnowledgeEntriesResponse {
  repeated KnowledgeEntry entries = 1;
}

// ReviewKnowledgeEntry 请求/响应（D-054 人工复核）。
message ReviewKnowledgeEntryRequest {
  string signature = 1;        // 要复核的条目签名
  string status = 2;           // 复核后生命周期状态（active / superseded / retracted）
  string verdict = 3;          // 复核后判定文本（可选；留空 = 保留原判定）
  string validation_note = 4;  // 复核结论（中文，必填给决策留痕）
}

message ReviewKnowledgeEntryResponse {}
