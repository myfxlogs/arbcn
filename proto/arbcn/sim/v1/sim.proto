// arbcn 模拟执行 ConnectRPC 服务（docs/design/04-m3-spec.md §10 M3-c）。
// 独立域 arbcn.sim.v1（D-038 ①）：9 个 RPC（ListSimOrders / ConfirmSimOrder /
// CloseSimOrder / ListSimPositions / GetSimReport / GetTestnetAccounts / GetSimAccount /
// GetPerformanceReport / GetReplayState）。
// 写路径仅 ConfirmSimOrder + CloseSimOrder（D-055 人工整单平，订单全部腿一起退，
// 绝不单腿留裸敞口 D-019）；确认后仍是模拟（SIMULATED），无任何通往真实资金的
// 按钮/路径（§6/§8；不赌原则 D-019）。
// GetSimAccount（D-056 完整现金账本）= 只读账户视图：现金余额 + 逐笔流水 + 净值对账。
// GetPerformanceReport（D-062 阶段 0 判定门① 测量）= 只读跨窗口 TWR/MWR + 判定门① 状态
// + 环境条件，不触发任何写路径（判定门① 只测量不自动执行）。
// 与 dashboardv1 互不依赖（不动 dashboardv1 生成物，独立域零回归）。
syntax = "proto3";

package arbcn.sim.v1;

option go_package = "arbcn/internal/simapi/gen/arbcn/sim/v1;simv1";

// SimOrder 与 store.SimOrder 对应（04-m3-spec §1.1 建议订单；§10.2 C1）。
// status 状态机：suggested → confirmed → filled / rejected / expired（§1.1）。
message SimOrder {
  int64 id = 1;
  int64 ts_ms = 2;            // 毫秒时间戳（前端 bigint 承载）
  string src_rule = 3;
  string kind = 4;
  string venue = 5;
  string symbol = 6;
  string side = 7;
  double qty = 8;
  double ref_price = 9;
  double expected_spread = 10;
  repeated string risk_flags = 11;
  string status = 12;
  string note = 13;
}

// SimPosition 与 store.SimPosition 对应（04-m3-spec §1.2 模拟成交腿）。
// hedge = 两行（现货 long + 永续 short），carry/repo = 一行。
// pnl = 已结算累计（模拟 USD）；pnl_rmb = 即期汇率折算（H1/R6#1 刻度线：绝对金额
// 用即期 USDCNH 直接乘，非 RMBDayEnd 年化口径；汇率缺失 = 0，前端标注「USD 原值」）。
message SimPosition {
  int64 id = 1;
  int64 order_id = 2;
  int64 ts_ms = 3;
  string kind = 4;
  string venue = 5;
  string symbol = 6;
  string side = 7;
  double qty = 8;
  double ref_price = 9;
  bool funding = 10;
  double pnl = 11;            // 已结算累计（模拟 USD）
  double pnl_rmb = 12;        // 即期折算（汇率缺失 = 0，前端标注）
  string status = 13;
  double cur_price = 14;      // 实时价（ticker 最新；查不到 = 0，前端标 —）
  double expected_ann = 15;   // 预期年化%（当前 funding 年化；现货腿/查不到 = 0，前端标 —）
  double unrealized_pnl = 16; // 未实现浮动 = (cur_price - ref_price) × qty × 方向（long=+1 short=-1）
}

message ListSimOrdersRequest  { string status = 1; }        // 空 = 全部
message ListSimOrdersResponse { repeated SimOrder orders = 1; }
message ConfirmSimOrderRequest  { int64 id = 1; }
message ConfirmSimOrderResponse {
  SimOrder order = 1;         // 确认后（filled 或 rejected+SPREAD_DRIFT）
  bool accepted = 2;          // true = 成交；false = 二次门禁拒单
}
message ListSimPositionsRequest  {}
message ListSimPositionsResponse {
  repeated SimPosition positions = 1;
  bool fx_available = 2;  // 即期 USDCNH 可用（false → 前端按「USD 原值」标注，非真零 PnL；D-047 消除 0 占位启发式）
}

// CloseSimOrder 人工平仓（D-055）：整单平仓——订单全部 open 腿结算浮动后置 settled，
// 订单置 closed。id 必填（仅 filled 订单可平）；note 平仓备注（可空）。
// 对 funding_hedge 对冲结构 = 两腿一起退（不赌原则 D-019：绝不单腿留裸敞口）。
message CloseSimOrderRequest {
  int64 id = 1;
  string note = 2;
}
message CloseSimOrderResponse {
  int64 order_id = 1;
  int32 closed_legs = 2;      // 平掉的腿数
  double realized_pnl = 3;    // 平仓实现净 PnL（已结算 + 浮动合计，模拟 USD）
  double realized_rmb = 4;    // 即期 USDCNH 折算（汇率缺失 = 0，前端标注 USD 原值）
}
message GetSimReportRequest {}
message GetSimReportResponse {
  string markdown = 1;        // 报告内容（文件不存在 = 空 + note 说明）
  bool exists = 2;
  string note = 3;            // 未生成时说明"周频报告每 7×8h tick 渲染"
}

// TestnetAccountDetail 测试网账户单资产余额（D-040）。asset/balance 保留 API 原字符串
// （避免浮点精度）；equity_usd 有 USD 折算则填（okx eqUsd / binance 稳定币 = balance），
// 未知 = 0（前端标 —）。
message TestnetAccountDetail {
  string asset = 1;
  string balance = 2;
  double equity_usd = 3;
}

// TestnetAccount 测试网账户快照（D-040 测试网账户区数据面；探针余额查询结果）。
// equity_usd 口径因 source 而异（前端按 source 明示，诚实标注）：
//   sim_testnet_binance → 稳定币合计近似（无行情折算非稳定币，非全量净值）
//   sim_testnet_okx     → totalEq（交易所精确折算）
message TestnetAccount {
  string source = 1;          // sim_testnet_binance / sim_testnet_okx
  string account_alias = 2;   // binance accountAlias / okx 无
  double equity_usd = 3;
  repeated TestnetAccountDetail details = 4;
  int64 updated_at_ms = 5;    // 最近余额查询成功时刻（毫秒，前端 bigint 承载）
}

message GetTestnetAccountsRequest {}
message GetTestnetAccountsResponse { repeated TestnetAccount accounts = 1; }

// CashFlow 模拟账户单笔现金流流水（D-056 完整现金账本逐笔流水）。
// kind = capital_in（入金）/ open（开仓）/ funding（8h 资金费）/ close（平仓）。
// amount 正 = 入金（+现金），负 = 出金（−现金）；order_id/leg_id = 0 无关联（入金流水）。
message CashFlow {
  int64 id = 1;
  int64 ts_ms = 2;
  int64 order_id = 3;
  int64 leg_id = 4;
  string kind = 5;
  double amount = 6;
  string note = 7;
}

// GetSimAccount 模拟账户快照（D-056）：现金余额 + 逐笔流水 + 净值对账。
// 口径：realized_pnl = Σ 腿已结算 pnl；unrealized_pnl = Σ open 腿 (cur−ref)×qty×dir；
// market_value = Σ open 腿 dir×qty×cur（dir：long+1/short−1）；equity = cash + market_value
// = capital + realized + unrealized（双恒等式，前端同时展示供交叉校验）。
// equity_rmb 即期 USDCNH 折算（汇率缺失 = 0，前端标注 USD 原值）。
message GetSimAccountRequest {}
message GetSimAccountResponse {
  double capital = 1;         // 初始本金
  double cash = 2;            // 现金余额
  double realized_pnl = 3;    // 已实现（Σ 腿 pnl）
  double unrealized_pnl = 4;  // 未实现（Σ open 腿浮动）
  double market_value = 5;    // 持仓市值（Σ open 腿 dir×qty×cur，可负）
  double equity = 6;          // 净值 = cash + market_value
  bool fx_available = 7;      // 即期 USDCNH 可用
  double equity_rmb = 8;      // 净值即期折算
  repeated CashFlow flows = 9; // 逐笔流水（最近 100 条，ts DESC）
}

// GetPerformanceReport 阶段 0 判定门① 测量（D-062）：跨窗口 paper 收益 TWR/MWR +
// 判定门① 判定 + 环境条件（D-061 环境-策略分离）。
//   - 窗口 = 最近 30 天（D-058）；窗口未满 30 天 → status=pending（诚实标「前向验证进行中」）。
//   - TWR 时间加权年化 / MWR 资金加权年化（当前无外部进出二者一致；阶段 A 真金出入金后分叉）。
//   - 判定门①：pass（TWR ≥ 判定线 4.0% = 基线 3.7% + 摩擦 0.3%，可进阶段 A）/ watch /
//     fail（止投）/ env_no_window（窗口零成交 → 环境无机会非策略失败，D-061）/ pending /
//     data_anomaly。只测量不自动执行——进阶段 A 仍人工决策。
//   - 环境条件：窗口内 funding 中位数/max/≥15% 高费率时段数/可交易面（只覆盖监控面内，
//     诚实标注）。零执行门禁/规则/阈值改动（D-062）。
message GetPerformanceReportRequest {}
message GetPerformanceReportResponse {
  double window_days = 1;        // 首尾快照天数（窗口未满 = 实际天数 < 30）
  double twr_annualized = 2;     // TWR 时间加权年化 %（不可算 = 0 + status 说明）
  double mwr_annualized = 3;     // MWR 资金加权年化 %（同上）
  string status = 4;             // pass/watch/fail/env_no_window/pending/data_anomaly
  string status_note = 5;        // 判定门① 中文说明（含判据）
  double baseline_low = 6;       // 诚实基线下限 %（3.2）
  double baseline_high = 7;      // 诚实基线上限 %（3.7）
  double friction_margin = 8;    // 摩擦余量 %（0.3，D-046 业主核实普通主户）
  double gate_threshold = 9;     // 判定线 %（= baseline_high + friction_margin = 4.0）
  double funding_median = 10;    // 窗口内 funding 中位数 %（环境条件；无数据 = 0）
  double funding_max = 11;       // 窗口内 funding max %（无数据 = 0）
  int32 high_window_events = 12; // 窗口内 funding ≥ 15% 时段数（D-016 高费率窗口）
  int32 tradable_pairs = 13;     // 可交易面 = distinct (venue,symbol) 对（监控面内）
  int32 order_count = 14;        // 窗口内成交单数（filled+closed；0 = 测环境非策略）
  int32 rejected_count = 15;     // 窗口内拒单数（rejected 负样本）
  int64 start_ts_ms = 16;        // 窗口起点快照时刻
  int64 end_ts_ms = 17;          // 窗口末点快照时刻
  int32 snapshot_count = 18;     // 窗口内实际 equity 快照数（D-063 可信度：判定数据面自证）
  int32 expected_snapshots = 19; // 连续运行基线期望快照数（8h tick；30d→90）
  double snapshot_coverage = 20; // 实际/期望覆盖率（0–1；<0.9 → 判定不采信）
}

// GetReplayState 回放证伪门禁证据面（D-065 修订：只读，可检查性 P4——门禁休眠也可见）。
// 每策略 kind 当前回放判据（订单管线在 buildSignal 对每个建单信号强制自动执行同款判据，
// 本 RPC 只读重算展示当前状态；不触发任何写路径）。
message GetReplayStateRequest {}
message ReplayStateKind {
  string kind = 1;         // 策略 kind（funding_hedge / carry_asset / repo）
  string rate_kind = 2;    // 回放数据面事实 kind（funding / defi_rate / reverse_repo）
  string verdict = 3;      // pass / watch / falsified / no_window（D-065）
  string note = 4;         // 自述判定（含判据/阈值，中文）
  int32 window_count = 5;  // 历史高费率窗口数（0 = 环境无窗口 D-061 ②）
  int32 total_samples = 6; // 回放样本数
  int32 high_samples = 7;  // ≥ 高费率档读数数
  double mean_net_ann = 8; // 样本加权均值净年化 %（无窗口 = 0）
  double best_net_ann = 9; // 最佳窗口净年化 %
  double worst_net_ann = 10; // 最差窗口净年化 %
  double tier_pct = 11;    // 该策略高费率档 %
  double friction_pct = 12; // 该策略一次性摩擦 %
}
message GetReplayStateResponse {
  repeated ReplayStateKind kinds = 1;
  int32 history_days = 2; // 回放历史窗口天（ReplayHistoryDays）
}

// SimService 为模拟执行面板提供查询与人工确认接口（M3-c 唯一写路径 = ConfirmSimOrder）。
service SimService {
  rpc ListSimOrders(ListSimOrdersRequest) returns (ListSimOrdersResponse);
  rpc ConfirmSimOrder(ConfirmSimOrderRequest) returns (ConfirmSimOrderResponse);
  rpc CloseSimOrder(CloseSimOrderRequest) returns (CloseSimOrderResponse);
  rpc ListSimPositions(ListSimPositionsRequest) returns (ListSimPositionsResponse);
  rpc GetSimReport(GetSimReportRequest) returns (GetSimReportResponse);
  rpc GetTestnetAccounts(GetTestnetAccountsRequest) returns (GetTestnetAccountsResponse);
  rpc GetSimAccount(GetSimAccountRequest) returns (GetSimAccountResponse);
  rpc GetPerformanceReport(GetPerformanceReportRequest) returns (GetPerformanceReportResponse);
  rpc GetReplayState(GetReplayStateRequest) returns (GetReplayStateResponse);
}
